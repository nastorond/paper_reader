# 앱 빌드.
#   - 태그 푸시(v0.2.0 등, scripts/release.sh 로 만든다) → macOS·Windows 를 빌드해 GitHub Release 로 올린다.
#     업데이트 정보(latest.json)와 서명도 함께 올려서, 설치된 앱이 자동 업데이트한다.
#     필요한 Secret: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (README "자동 업데이트" 참고)
#   - Actions 탭의 "Run workflow"(수동) → Windows 설치 파일만 만들어 실행 결과의 Artifacts 에 올린다(업데이트 서명 없음).
#   - Android .apk: 저장소 Secrets 에 Android 서명 키가 있을 때만(아래 android 작업 참고).
# 데스크톱 앱은 코드 서명(Apple·Microsoft 인증서)이 없어 처음 설치할 때 OS 경고가 뜰 수 있다.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Release 만들기·파일 올리기
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PaperBoard ${{ github.ref_name }}
          releaseBody: "설치된 앱은 다음 실행 때 자동으로 업데이트를 안내합니다. 처음 설치는 아래 파일(macOS .dmg / Windows -setup.exe)을 받으세요."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

  desktop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # 수동 빌드는 업데이트 서명 파일을 만들지 않는다(서명 키 없이도 빌드되게)
      - run: pnpm tauri build --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v7
        with:
          name: PaperBoard-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  # Android 릴리스 APK. 서명 키를 저장소 Secrets 에 넣어야 만든다(없으면 건너뜀):
  #   ANDROID_KEYSTORE_BASE64   = base64 로 바꾼 src-tauri/gen/android/paperboard-release.jks
  #   ANDROID_KEYSTORE_PASSWORD = src-tauri/gen/android/keystore.properties 의 password 값
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 서명 키가 없으면 건너뜀
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 Secret 이 없어 Android 빌드를 건너뜁니다."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
      - uses: pnpm/action-setup@v6
        if: env.HAS_KEY == 'true'
        with:
          version: 12
      - uses: actions/setup-node@v7
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        if: env.HAS_KEY == 'true'
      - name: NDK 설치
        if: env.HAS_KEY == 'true'
        run: |
          sdkmanager "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_KEY == 'true'
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_KEY == 'true'
        with:
          workspaces: src-tauri
      - name: 서명 키 준비
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dir="$GITHUB_WORKSPACE/src-tauri/gen/android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/paperboard-release.jks"
          printf 'password=%s\nkeyAlias=paperboard\nstoreFile=%s\n' "$KEYSTORE_PASSWORD" "$dir/paperboard-release.jks" > "$dir/keystore.properties"
      - if: env.HAS_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_KEY == 'true'
        run: pnpm tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v7
        if: env.HAS_KEY == 'true'
        with:
          name: PaperBoard-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
