# 푸시·PR 마다 타입체크와 테스트.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 테스트가 node:sqlite 를 쓴다
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      # fixtures/KCI_*.pdf(개인 논문)는 저장소에 없어서 그 테스트는 건너뛴다
      - run: pnpm vitest run
